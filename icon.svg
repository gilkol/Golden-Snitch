<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon / favicon master.
  Colours mirror the game palette in styles.css so the icon and the in-game
  Snitch read as the same object. Full-bleed square: iOS applies its own
  rounded-corner mask.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Golden Snitch">
  <defs>
    <!-- Night sky, same top-to-bottom ramp as the app shell -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10143a"/>
      <stop offset="0.55" stop-color="#0b0b1f"/>
      <stop offset="1" stop-color="#05050f"/>
    </linearGradient>

    <radialGradient id="purpleGlow" cx="0.5" cy="0.04" r="0.8">
      <stop offset="0" stop-color="#3d2a6b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3d2a6b" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm halo standing in for the body's box-shadow glow -->
    <radialGradient id="goldGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8c14a" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#e8c14a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8c14a" stop-opacity="0"/>
    </radialGradient>

    <!-- Off-centre highlight, matching .snitch-body -->
    <radialGradient id="ball" cx="0.32" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#e8c14a"/>
      <stop offset="1" stop-color="#a8791d"/>
    </radialGradient>

    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#e9eef7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#purpleGlow)"/>

  <!-- A few faint stars -->
  <g fill="#e9eef7">
    <circle cx="86" cy="94" r="2.4" opacity="0.5"/>
    <circle cx="412" cy="118" r="2" opacity="0.4"/>
    <circle cx="140" cy="404" r="1.8" opacity="0.35"/>
    <circle cx="392" cy="428" r="2.2" opacity="0.3"/>
    <circle cx="256" cy="62" r="1.8" opacity="0.35"/>
  </g>

  <!-- Glow behind the body -->
  <circle cx="256" cy="262" r="205" fill="url(#goldGlow)"/>

  <!-- Wings, drawn first so the body overlaps their inner ends -->
  <g fill="url(#wing)">
    <path d="M 174 252 Q 108 176 38 208 Q 100 258 174 252 Z"/>
    <path d="M 338 252 Q 404 176 474 208 Q 412 258 338 252 Z"/>
  </g>

  <!-- Body -->
  <circle cx="256" cy="262" r="104" fill="url(#ball)"/>
</svg>
